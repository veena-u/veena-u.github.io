function draw() {
  L.scores.innerHTML = ""; L.labels.innerHTML = "";
  $("scale").innerHTML = masked ? 'chance <i style="background:linear-gradient(90deg,rgba(180,83,9,.08),#b45309)"></i>' : 'score − <i style="background:linear-gradient(90deg,#475569,#fff,#b45309)"></i> +';
  EDGES.forEach((_, e) => {
    if (masked && !T.legal[e]) return;
    segment(L.scores, e, masked ? { stroke: "#b45309", "stroke-width": 9, opacity: Math.max(0.12, Math.sqrt(P[e])).toFixed(3) } : { stroke: grey(T.scores[e]), "stroke-width": 7 });
    if (masked && P[e] >= 0.01) { const [[x1, y1], [x2, y2]] = EDGES[e].map(v => pt(VERTS[v]));
      add(L.labels, "text", { x: (x1 + x2) / 2 + 22, y: (y1 + y2) / 2 + 4, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "#111", style: "paint-order:stroke;stroke:#fff;stroke-width:3px" }, pct(P[e])); }
  });
}
$("mask").addEventListener("click", () => { masked = !masked; $("mask").classList.toggle("on", masked); draw(); });
draw();
// Pointing at an edge or at its key: both light up, and the tooltip gives its score (or its chance with the mask on).
const tip = $("tip");
function focus(e) {
  L.marks.innerHTML = "";
  segment(L.marks, e, { stroke: "#facc15", "stroke-width": 14, opacity: 0.85 });
  segment(L.marks, e, { stroke: "#111", "stroke-width": 3 });
  rowMark.setAttribute("y", KY + e * KH - 1);
}
function say(ev, e) {
  tip.textContent = masked ? (T.legal[e] ? pct(P[e]) : "not legal") : `${T.scores[e] > 0 ? "+" : ""}${T.scores[e].toFixed(1)}`;
  tip.style.display = "block";
  const w = tip.offsetWidth / 2 + 4;
  tip.style.left = Math.min(Math.max(ev.clientX, w), innerWidth - w) + "px"; tip.style.top = ev.clientY + "px";
}
const chosen = legal.reduce((a, e) => P[e] > P[a] ? e : a, legal[0]);
svg.addEventListener("mousemove", ev => { const q = ev.target.closest("[data-e]"); if (!q) { tip.style.display = "none"; return; } focus(+q.dataset.e); say(ev, +q.dataset.e); });
qkHit.addEventListener("mousemove", ev => {
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(QK.getScreenCTM().inverse()), e = Math.max(0, Math.min(71, Math.floor((p.y - KY) / KH)));
  focus(e); say(ev, e);
});
[svg, qkHit].forEach(el => el.addEventListener("mouseleave", () => { tip.style.display = "none"; focus(chosen); }));
focus(chosen);

if (window.frameElement) {
  new ResizeObserver(() => { window.frameElement.style.height = document.body.offsetHeight + "px"; }).observe(document.body);
}
</script>
</body>
</html>
