const gelu = v => 0.5 * v * (1 + Math.tanh(0.7978845608 * (v + 0.044715 * v ** 3)));
function heat(x, y, after) {
  const c = document.createElement("canvas");
  c.width = H; c.height = N;
  const ctx = c.getContext("2d"), img = ctx.createImageData(H, N);
  for (let i = 0; i < N * H; i++) {
    let v = PRE[i] / 127 * DATA.lim;
    if (after) v = gelu(v);
    const t = Math.min(1, Math.abs(v) / DATA.lim), [r, g, b] = v >= 0 ? [180, 83, 9] : [71, 85, 105];
    img.data[4 * i] = 255 + (r - 255) * t; img.data[4 * i + 1] = 255 + (g - 255) * t; img.data[4 * i + 2] = 255 + (b - 255) * t; img.data[4 * i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  add(fig, "image", { x, y, width: H * SC, height: N * SC, href: c.toDataURL(), preserveAspectRatio: "none" });
}

// 1. The feed forward step: 128 numbers per row become 512, the GELU keeps the positive ones, and 512 become 128 again.
const A = 34, AH = N * SC, GX = 20, HX = 210, A2 = A + AH + 58;
label(GX, A - 16, "Grid", "155 × 128");
grid(GX, A, SC);
line(`M${GX + 128 * SC + 6},${A + AH / 2} H${HX - 92}`);
pill(HX - 92, A + AH / 2, "128 × 512");
line(`M${HX - 14},${A + AH / 2} H${HX - 6}`);
label(HX, A - 16, "512 numbers per row", "155 × 512");
heat(HX, A, false);
const RX = HX + H * SC + 14;
add(fig, "rect", { x: RX, y: A + AH / 2 - 12, width: 9, height: 9, fill: "#b45309" });
add(fig, "text", { x: RX + 14, y: A + AH / 2 - 4, class: "dim" }, "positive");
add(fig, "rect", { x: RX, y: A + AH / 2 + 4, width: 9, height: 9, fill: "#475569" });
add(fig, "text", { x: RX + 14, y: A + AH / 2 + 12, class: "dim" }, "negative");
// Down through the GELU.
line(`M${HX + H * SC / 2},${A + AH + 6} V${A2 - 6}`);
add(fig, "path", { d: `M${HX + H * SC / 2 - 4},${A2 - 11} L${HX + H * SC / 2},${A2 - 6} L${HX + H * SC / 2 + 4},${A2 - 11}`, fill: "none", stroke: "#9ca3af", "stroke-width": 1.2 });
add(fig, "text", { x: HX + H * SC / 2 + 10, y: A + AH + 29, class: "dim" }, "GELU: negatives squashed to about zero");
heat(HX, A2, true);
add(fig, "text", { x: HX, y: A2 + AH + 14, class: "dim" }, "155 × 512");
// Back to 128 and onto the grid.
const OX = HX + H * SC;
line(`M${OX + 6},${A2 + AH / 2} H${OX + 22}`);
pill(OX + 22, A2 + AH / 2, "512 × 128");
op(OX + 112, A2 + AH / 2 + 5, "+");
label(OX + 132, A2 - 16, "Grid", "");
grid(OX + 132, A2, SC);
op(OX + 132 + 128 * SC + 10, A2 + AH / 2 + 5, "=");
label(OX + 132 + 128 * SC + 30, A2 - 16, "New grid");
grid(OX + 132 + 128 * SC + 30, A2, SC);
add(fig, "text", { x: OX + 132 + 128 * SC + 30, y: A2 + AH + 14, class: "dim" }, "155 × 128");

// Follow one row through.
const marks = [];
function select(i) {
  marks.forEach(m => m.remove());
  marks.length = 0;
  [[GX, 128 * SC, A], [HX, H * SC, A], [HX, H * SC, A2], [OX + 132, 128 * SC, A2], [OX + 162 + 128 * SC, 128 * SC, A2]].forEach(([x, w, y]) =>
    marks.push(add(fig, "rect", { x: x - 1.5, y: y + i * SC - 1, width: w + 3, height: 2.6, fill: "none", stroke: "#111", "stroke-width": 1.1, "pointer-events": "none" })));
}
const pointer = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(fig.getScreenCTM().inverse());
[[GX, 128 * SC, A], [HX, H * SC, A], [HX, H * SC, A2], [OX + 132, 128 * SC, A2], [OX + 162 + 128 * SC, 128 * SC, A2]].forEach(([x, w, y]) => {
  const hit = add(fig, "rect", { x, y, width: w, height: AH, fill: "transparent", class: "pick" });
  hit.addEventListener("mousemove", e => select(Math.max(0, Math.min(N - 1, Math.floor((pointer(e).y - y) / SC)))));
});
select(48);

fig.setAttribute("viewBox", `-10 0 940 ${A2 + AH + 24}`);

if (window.frameElement) {
  new ResizeObserver(() => { window.frameElement.style.height = document.body.offsetHeight + "px"; }).observe(document.body);
}
</script>
</body>
</html>
