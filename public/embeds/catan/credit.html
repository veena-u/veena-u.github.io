.seats span { padding: 2px 10px; border-radius: 4px; border: 1px solid #e5e7eb; font-size: 12px; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; }

.seats span.cur { border-color: #111; box-shadow: 0 0 0 1px #111; }
.move b { font: 600 12px ui-monospace, Menlo, monospace; margin-left: 8px; }
.hint { font: 10.5px ui-monospace, Menlo, monospace; color: #9ca3af; margin-top: 2px; }

let seat = D.winner;

function pick(t) {

  }
  if (room) { add(zoom, "text", { x: zx(t) - 6, y: WY + 6, "text-anchor": "end", class: "dim" }, "how much each");
    add(zoom, "text", { x: zx(t) - 6, y: WY + 17, "text-anchor": "end", class: "dim" }, "moment counts →"); }

function choose(s) {
