<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the network</title>
<style>
/* ---- Tokens: the blog's flat "pixel" look (ink, paper, hard offset shadows, square corners), with colour. */
:root {
  --ink: #2b2e28; --paper: #f5f5f5; --card: #fffefa; --rule: #bdbbb4; --dim: #6f6d66; --dot: #dddbd4;
  --sea: #7cb7d8; --sea-deep: #5d9cc1;
  --brick: #dc8463; --lumber: #5e9a5f; --wool: #b8dc86; --grain: #f1cd5b; --ore: #a7aebb; --desert: #e8dbb3;
  --dev: #efe3c2;
  --p0: #2a5bd7; --p1: #f07a1a; --p2: #1c8a46; --p3: #d9418f;
  --t1: 120ms; --t2: 200ms; --t3: 320ms; --t4: 480ms;
  --out: cubic-bezier(.2, .7, .3, 1); --in: cubic-bezier(.6, 0, .8, .4);
  --shadow: 3px 3px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color: var(--ink); background: var(--paper); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
button { font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 0; box-shadow: var(--shadow);
  padding: 5px 11px; cursor: pointer; transition: transform var(--t1) var(--out), box-shadow var(--t1) var(--out), opacity var(--t2); }
button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
button:disabled { opacity: .35; cursor: default; box-shadow: none; }
button.primary { background: var(--ink); color: var(--paper); }
button.on { background: var(--ink); color: var(--paper); }
button.flat { box-shadow: none; border-color: transparent; background: transparent; padding: 4px 8px; }
button.flat:hover:not(:disabled) { transform: none; box-shadow: none; border-color: var(--ink); }
button.mini { padding: 2px 8px; font-size: 12px; box-shadow: 2px 2px 0 var(--ink); }

/* ---- Layout: top bar, forecast strip, the stage (board and seats), your bar. */
#app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; height: 100vh; border: 2px solid var(--ink); background: var(--paper); }
#top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 2px solid var(--ink); background: var(--card); }
#top .rules { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; min-width: 0; display: flex; }
#top .rules span + span { border-left: 1.5px solid var(--rule); margin-left: 8px; padding-left: 8px; }
#top .grow { flex: 1; }
.seg { display: flex; border: 2px solid var(--ink); }
.seg button { border: 0; box-shadow: none; padding: 2px 8px; font-size: 12px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button:hover:not(:disabled) { transform: none; box-shadow: none; background: var(--paper); }
.seg button.on, .seg button.on:hover { background: var(--ink); color: var(--paper); }
.icon { width: 30px; height: 28px; padding: 0; display: grid; place-items: center; }
.icon svg { width: 14px; height: 14px; }

#forecast { display: flex; height: 0; overflow: hidden; transition: height var(--t2) var(--out); }
#forecast.show { height: 24px; border-bottom: 2px solid var(--ink); }
#forecast .seg-f { height: 100%; display: flex; align-items: center; padding: 0 8px; font: 600 11px system-ui; color: #fff; white-space: nowrap; overflow: hidden;
  transition: flex-grow var(--t4) var(--out); min-width: 0; }
#forecast .seg-f + .seg-f { border-left: 2px solid var(--ink); }
#forecast .lbl { padding: 0 8px; display: flex; align-items: center; font-size: 11px; color: var(--dim); background: var(--card); border-right: 2px solid var(--ink); white-space: nowrap; }

#stage { position: relative; min-height: 0; overflow: hidden; overflow: clip;
  background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 14px 14px; }
#board { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); display: block; }

/* Seats sit in the corners of the stage, clockwise from you at the bottom left. */
#plates { position: absolute; inset: 0; pointer-events: none; }
.plate { position: absolute; width: 176px; pointer-events: auto; background: var(--card); border: 2px solid var(--ink); box-shadow: var(--shadow);
  display: grid; grid-template-columns: 8px 1fr; transition: transform var(--t3) var(--out), box-shadow var(--t3) var(--out); }
.plate.pos-0 { left: 12px; bottom: 12px; } .plate.pos-1 { left: 12px; top: 12px; } .plate.pos-2 { right: 12px; top: 12px; } .plate.pos-3 { right: 12px; bottom: 12px; }
.plate .strip { background: var(--pc); border-right: 2px solid var(--ink); }
.plate .pb { padding: 6px 9px 7px; min-width: 0; }
.plate .row1 { display: flex; align-items: baseline; gap: 6px; }
.plate .name { font-weight: 700; font-size: 13px; flex: 1; white-space: nowrap; }
.plate .vp { font: 700 20px/1 system-ui; }
.plate .vp small { font-size: 11px; color: var(--dim); font-weight: 500; }
.plate .row2 { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 11.5px; }
.plate .row2 span { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.plate .cards i, .plate .devs i { width: 10px; height: 14px; border: 1.5px solid var(--ink); display: inline-block; }
.plate .cards i { background: var(--ink); box-shadow: 1.5px -1.5px 0 var(--card), 3px -3px 0 var(--ink); margin-right: 3px; }
.plate .devs i { background: var(--dev); }
.plate .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.plate .badges:empty { display: none; }
.badge { white-space: nowrap; font-size: 10.5px; font-weight: 600; padding: 0 5px; border: 1.5px solid var(--ink); background: var(--grain); }
.plate.turn { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--pc); }
.plate.thinking .strip { animation: breathe 1.1s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.plate.pickable { cursor: pointer; outline: 2px dashed var(--ink); outline-offset: 4px; animation: nudge .9s ease-in-out infinite; }
@keyframes nudge { 50% { outline-offset: 7px; } }
.stamp { position: absolute; right: -8px; top: -12px; padding: 1px 7px; font: 700 11px system-ui; text-transform: uppercase; letter-spacing: .04em;
  border: 2px solid var(--ink); background: var(--card); transform: rotate(-6deg); }
.stamp.yes { background: var(--wool); } .stamp.no { background: var(--brick); color: #fff; } .stamp.counter { background: var(--grain); }
.stamp.wait { color: var(--dim); }
.pop { animation: pop var(--t3) var(--out); }
@keyframes pop { 0% { transform: scale(.6) rotate(-6deg); } 60% { transform: scale(1.15) rotate(-6deg); } 100% { transform: scale(1) rotate(-6deg); } }
.bump { animation: bump var(--t2) var(--out); }
@keyframes bump { 50% { transform: scale(1.18); } }

/* What to do now, or what just happened: one tag, top centre. */
#prompt { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 400px)); display: none;
  background: var(--card); border: 2px solid var(--ink); box-shadow: var(--shadow); font-size: 13px; z-index: 3; }
#prompt.show { display: block; }
#prompt .main { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
#prompt .chip { width: 10px; height: 10px; border: 1.5px solid var(--ink); flex: none; }
#prompt .extra { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
#prompt .hint { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-top: 2px solid var(--ink); background: var(--paper); font-size: 12px; }
#prompt .hint b { font-weight: 700; }

/* The table, a strip across the top: the dice on the left, the bank on the right. */
#table { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-bottom: 2px solid var(--ink); background: var(--paper); flex-wrap: wrap; }
#table .grow { flex: 1; }
#rolled { display: flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
#rolled .chip { width: 10px; height: 10px; border: 1.5px solid var(--ink); }
#rolled b { font-size: 16px; }
#rolled .none { color: var(--dim); }
#bank { display: flex; gap: 5px; align-items: center; }
#bank .mini { width: 26px; height: 34px; border: 1.5px solid var(--ink); box-shadow: 1.5px 1.5px 0 var(--ink); display: grid; place-items: end center; font: 700 10.5px system-ui; padding-bottom: 1px; position: relative; }
#bank .mini svg { position: absolute; top: 4px; left: 5px; width: 13px; height: 13px; opacity: .7; }
#bank .mini.deck { background: var(--dev); margin-left: 6px; }
#bank .mini.deck::before { content: "DEV"; position: absolute; top: 5px; left: 0; right: 0; text-align: center; font: 800 8px system-ui; letter-spacing: .04em; }
#bank .lbl { font-size: 12px; color: var(--dim); margin-right: 3px; }

/* Your bar: hand, development cards, dice, actions. */
#bottom { display: flex; align-items: flex-end; gap: 14px; padding: 10px 12px 12px; border-top: 2px solid var(--ink); background: var(--card); min-height: 92px; }
#hand, #devs { display: flex; gap: 6px; align-items: flex-end; }
#devs:empty { display: none; }
#devs { padding-left: 14px; border-left: 2px solid var(--rule); }
.card { width: 42px; height: 58px; border: 2px solid var(--ink); position: relative; display: grid; place-items: center; box-shadow: 2px 2px 0 var(--ink);
  transition: transform var(--t2) var(--out), opacity var(--t2); user-select: none; }
.card svg { width: 22px; height: 22px; margin-top: -10px; opacity: .78; }
.card .n { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font: 700 14px system-ui; }
.card.empty { border-style: dashed; border-color: var(--rule); box-shadow: none; background: transparent !important; }
.card.empty svg { opacity: .18; } .card.empty .n { color: var(--rule); }
.card.many { box-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--card), 6px 6px 0 var(--ink); }
.card.live { cursor: pointer; }
.card.live:hover { transform: translateY(-5px); }
/* Development cards: parchment, named, with what you can do with each right now along the bottom. */
.card.dev { width: 62px; background: var(--dev); place-items: start center; padding-top: 4px; }
.card.dev svg { margin: 0; width: 16px; height: 16px; opacity: .85; }
.card.dev .nm { position: absolute; top: 22px; left: 2px; right: 2px; text-align: center; font: 700 9px/1.1 system-ui; }
.card.dev .tag { position: absolute; left: -2px; right: -2px; bottom: -2px; height: 15px; border: 2px solid var(--ink); background: var(--card);
  font: 800 8px/11px system-ui; text-transform: uppercase; letter-spacing: .05em; text-align: center; white-space: nowrap; }
.card.dev.live .tag { background: var(--ink); color: var(--paper); }
.card.dev.wait .tag { color: var(--dim); }
.card.dev .x { position: absolute; top: -9px; right: -9px; background: var(--ink); color: var(--paper); font: 700 10.5px system-ui; padding: 1px 4px; }
#bottom .grow { flex: 1; }
#dice { display: flex; gap: 6px; }
.die { width: 32px; height: 32px; background: var(--card); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 4px; transition: opacity var(--t3); }
.die i { width: 6px; height: 6px; background: var(--ink); place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
#dice.old .die { opacity: .4; }
#dice.seven .die i { background: #c0392b; }
#actions { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; justify-content: flex-end; }
.build { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 9px 5px; min-width: 62px; }
.build .cost { display: flex; gap: 2px; }
.build .cost i { width: 7px; height: 9px; border: 1px solid var(--ink); }
.build span:first-child { font-size: 12.5px; font-weight: 600; }
.build.on .cost i { border-color: var(--paper); }
#main { font-weight: 700; font-size: 14px; padding: 10px 18px; min-width: 104px; }

/* Trays over the stage: building an offer, the bank, discarding, picking a resource. */
.tray { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--card); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
  padding: 12px 14px; display: none; z-index: 4; min-width: 300px; animation: rise var(--t2) var(--out); }
.tray.show { display: block; }
@keyframes rise { from { transform: translate(-50%, 10px); opacity: 0; } }
.tray h3 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.tray h3 .x { margin-left: auto; }
.tray .row { display: flex; align-items: center; gap: 6px; margin: 7px 0; }
.tray .what { width: 54px; font-size: 12px; color: var(--dim); }
.tray .note { font-size: 12px; color: var(--dim); }
.chipr { width: 40px; height: 46px; border: 2px solid var(--ink); position: relative; display: grid; place-items: center; cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
  transition: transform var(--t1) var(--out); }
.chipr svg { width: 18px; height: 18px; opacity: .78; margin-top: -8px; }
.chipr .n { position: absolute; bottom: 1px; left: 0; right: 0; text-align: center; font: 700 11.5px system-ui; }
.chipr:hover:not(.off) { transform: translateY(-3px); }
.chipr.off { opacity: .28; cursor: default; box-shadow: none; }
.chipr.picked { outline: 3px solid var(--ink); outline-offset: 2px; }
.tiles { display: flex; gap: 8px; }
.tile { width: 18px; height: 24px; border: 1.5px solid var(--ink); position: relative; }
.tile b { position: absolute; right: -6px; bottom: -6px; background: var(--ink); color: var(--paper); font: 700 9.5px system-ui; padding: 0 3px; }
.tile.any { width: auto; padding: 0 6px; display: grid; place-items: center; font-size: 11px; background: var(--paper); }
.arrow { font-weight: 700; color: var(--dim); }
.big-pick { display: flex; gap: 10px; }
.big-pick .chipr { width: 52px; height: 70px; }
.big-pick .chipr svg { width: 26px; height: 26px; }

/* The open offer, under the prompt. */
#offer { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); background: var(--card); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
  padding: 10px 12px; display: none; z-index: 3; min-width: 280px; }
#offer.show { display: block; }
#offer .deal { display: flex; align-items: center; gap: 10px; }
#offer .side { display: flex; flex-direction: column; gap: 3px; }
#offer .side small { font-size: 10.5px; color: var(--dim); }
#offer .who { font-weight: 700; }
#offer .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
#offer .ctr { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 2px solid var(--rule); font-size: 12px; }
#offer .res { margin-top: 8px; font-size: 12px; color: var(--dim); }

/* The log, a drawer on the right. */
#log { position: absolute; top: 0; right: 0; bottom: 0; width: 290px; background: var(--card); border-left: 2px solid var(--ink); z-index: 6;
  transform: translateX(105%); visibility: hidden; transition: transform var(--t3) var(--out), visibility 0s var(--t3); display: flex; flex-direction: column; }
#log.open { transform: none; visibility: visible; transition: transform var(--t3) var(--out); }
#log header { display: flex; align-items: center; padding: 8px 10px; border-bottom: 2px solid var(--ink); font-weight: 700; }
#log header button { margin-left: auto; }
#log .list { overflow-y: auto; padding: 6px 12px 12px; font-size: 12.5px; flex: 1; }
#log .ev { padding: 4px 0; border-bottom: 1px solid var(--dot); }
#log .ev b { font-weight: 700; }
#log .ev .paid { font-size: 11.5px; color: var(--dim); padding-left: 10px; }

/* Start and end screens, over everything. */
#screen { position: absolute; inset: 0; z-index: 10; display: none; place-items: center; padding: 16px;
  background-color: rgba(245, 245, 245, .82); }
#screen.show { display: grid; }
#screen .box { background: var(--card); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 20px 22px; width: min(520px, 100%); animation: rise2 var(--t3) var(--out); }
@keyframes rise2 { from { transform: translateY(12px); opacity: 0; } }
#screen h2 { margin: 0 0 4px; font-size: 19px; }
#screen p { margin: 0 0 16px; color: var(--dim); }
#screen .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#screen .mode { text-align: left; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
#screen .mode b { font-size: 16px; }
#screen .mode small { color: var(--dim); font-size: 12px; }
#screen .mode.on small { color: var(--rule); }
#screen .seats { display: flex; flex-wrap: wrap; gap: 8px; }
#screen .seat { display: flex; align-items: center; gap: 7px; }
#screen .seat i { width: 12px; height: 12px; border: 1.5px solid var(--ink); }
#screen .seat small { color: var(--dim); }
#screen h4 { margin: 18px 0 8px; font-size: 13px; }
#screen .loading { margin-top: 14px; color: var(--dim); min-height: 18px; }
#screen .loading::after { content: "▮"; animation: blink 1s steps(1) infinite; margin-left: 3px; }
#screen .loading:empty::after { content: none; }
@keyframes blink { 50% { opacity: 0; } }
#screen .standings { margin: 10px 0 16px; }
#screen .standings div { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--dot); }
#screen .standings i { width: 12px; height: 12px; border: 1.5px solid var(--ink); }
#screen .standings b { margin-left: auto; font-size: 16px; }

/* Things in flight. */
#fly { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.fc { position: absolute; left: 0; top: 0; width: 26px; height: 36px; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); display: grid; place-items: center; }
.fc svg { width: 15px; height: 15px; opacity: .78; }
.fc.back { background: var(--ink); }
.fc.back::after { content: ""; width: 10px; height: 10px; border: 2px solid var(--paper); transform: rotate(45deg); opacity: .6; }
.fc.devc { background: var(--dev); }
.fc.devc:empty::after { content: "?"; font: 800 15px system-ui; }
#show { position: absolute; left: 50%; top: 50%; z-index: 8; pointer-events: none; display: none; width: 132px; height: 180px; margin: -90px 0 0 -66px;
  background: var(--card); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
#show .band { position: absolute; top: 0; left: 0; right: 0; height: 18px; border-bottom: 2px solid var(--ink); }
#show svg { width: 46px; height: 46px; }
#show b { font-size: 15px; }
#show small { color: var(--dim); }

/* The board. */
svg text { font-family: system-ui, -apple-system, sans-serif; }
.hex .lit { opacity: 0; pointer-events: none; }
.tok { transform-box: fill-box; transform-origin: center; }
.blocked { pointer-events: none; }
.ghost { cursor: pointer; }
.ghost .gb { opacity: 0; transition: opacity var(--t1); }
.ghost:hover .gb { opacity: 1; }
.ghost .gm { transition: opacity var(--t1), transform var(--t1); transform-box: fill-box; transform-origin: center; }
.ghost:hover .gm { opacity: 0; }
.ghost .gr { transition: stroke var(--t1), stroke-width var(--t1); }
.ghost:hover .gr { stroke: var(--c); stroke-width: 5.5px; }
.ghost.robber-g .gb { opacity: 1; fill-opacity: 0; }
.ghost.robber-g:hover .gb { fill-opacity: .22; }
.ghost.robber-g .pawn { opacity: .3; transition: opacity var(--t1); }
.ghost.robber-g:hover .pawn { opacity: .85; }
.body { transform-box: fill-box; transform-origin: 50% 100%; }

@media (max-width: 760px) {
  html, body { overflow: auto; height: auto; }
  #app { height: auto; min-height: 100vh; grid-template-rows: auto auto auto auto; }
  #top .rules { display: none; }
  #stage { display: flex; flex-direction: column; }
  #plates { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 8px 0; order: 0; }
  .plate { position: relative; width: auto; left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; }
  .plate.pos-0 { order: 3; }
  #board { position: relative; inset: auto; width: 100%; height: auto; aspect-ratio: 1 / .95; order: 1; }
  #prompt { position: relative; left: auto; top: auto; transform: none; max-width: none; margin: 8px 8px 0; order: 2; }
  #bank .lbl { display: none; }
  #offer, .tray { position: fixed; left: 8px; right: 8px; transform: none; min-width: 0; top: auto; bottom: 8px; animation: none; }
  #bottom { flex-wrap: wrap; }
  #actions { justify-content: flex-start; }
  .card { width: 38px; height: 52px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-brick" viewBox="0 0 20 20"><rect x="2" y="3" width="7" height="4"/><rect x="11" y="3" width="7" height="4"/><rect x="2" y="9" width="3" height="4"/><rect x="7" y="9" width="6" height="4"/><rect x="15" y="9" width="3" height="4"/><rect x="2" y="15" width="7" height="4"/><rect x="11" y="15" width="7" height="4"/></symbol>
  <symbol id="g-lumber" viewBox="0 0 20 20"><polygon points="10,1 15,8 12.5,8 17,14 3,14 7.5,8 5,8"/><rect x="8.5" y="14" width="3" height="5"/></symbol>
  <symbol id="g-wool" viewBox="0 0 20 20"><circle cx="6.5" cy="9.5" r="3.6"/><circle cx="10" cy="7" r="4"/><circle cx="13.5" cy="9.5" r="3.6"/><circle cx="10" cy="11.5" r="4"/><rect x="6.5" y="14" width="1.8" height="5"/><rect x="11.7" y="14" width="1.8" height="5"/></symbol>

<script type="module">
// The trained network to play against, entirely in the browser: the Rust engine compiled to WebAssembly (play/catan.wasm),
// the network in plain JavaScript (play/net.js, checked against PyTorch) and the Python viewer's game logic (play/session.js).
//
// How the page is built: the game (session) moves straight to its new state, and hands back what happened as a list of
// effects. The page keeps showing the old state and plays those effects one at a time (dice, cards, pieces, the robber),
// then settles on the new state. Your input and the network's next move both wait for that to finish.
import { loadEngine } from "./play/engine.js";
import { loadWeights, useKernel } from "./play/net.js";
import { Session, NAMES } from "./play/session.js";

const RES = ["brick", "lumber", "wool", "grain", "ore"];
const RES_NAME = ["Brick", "Lumber", "Wool", "Grain", "Ore"];
const DEV = [["knight", "Knight", "play knight"], ["victory-point", "Victory point", null], ["road-building", "Road building", "play road building"],
  ["year-of-plenty", "Year of plenty", "play year of plenty"], ["monopoly", "Monopoly", "play monopoly"]];
const DEV_TITLE = { knight: "Knight", "road building": "Road building", "year of plenty": "Year of plenty", monopoly: "Monopoly" };
const DEV_ABOUT = { knight: "move the robber", "road building": "two free roads", "year of plenty": "two cards from the bank", monopoly: "everyone's cards of one kind" };
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const TERRAIN = { hills: "--brick", forest: "--lumber", pasture: "--wool", fields: "--grain", mountains: "--ore", desert: "--desert" };
const TERRAIN_RES = { hills: 0, forest: 1, pasture: 2, fields: 3, mountains: 4 };
const COLOR = s => css(`--p${s}`);
const RCOLOR = r => css(`--${RES[r]}`);
const COST = { road: [1, 1, 0, 0, 0], settlement: [1, 1, 1, 1, 0], city: [0, 0, 0, 2, 3], card: [0, 0, 1, 1, 1] };
const R = 52, XS = R * Math.sqrt(3) / 2, YS = R / 2;
const INK = "#2b2e28", PAPER = "#f5f5f5", CARD = "#fffefa";

// ---- Motion: four durations, three easings, all scaled by the pace.
let pace = 1;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = ms => reduced ? 1 : ms * pace;
const OUT = "cubic-bezier(.2,.7,.3,1)", IN = "cubic-bezier(.6,0,.8,.4)", LAND = "cubic-bezier(.3,1.4,.5,1)";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const anim = (node, frames, ms, easing = OUT, extra = {}) => node.animate(frames, { duration: T(ms), easing, fill: "both", ...extra }).finished.catch(() => {});

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, kids = []) => {
  const node = tag.startsWith("svg:") ? document.createElementNS("http://www.w3.org/2000/svg", tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "on") for (const [e, f] of Object.entries(v)) node.addEventListener(e, f);
    else if (k === "text") node.textContent = v;
    else if (k === "html") node.innerHTML = v;

  for (const kid of [].concat(kids)) if (kid != null) node.append(kid);
  return node;
};
const glyph = (name, attrs = {}) => el("svg:svg", { viewBox: "0 0 20 20", ...attrs }, [el("svg:use", { href: `#g-${name}` })]);
const pt = ([x, y]) => [x * XS, y * YS];

let rolled = null;
let session = null, view = null, disp = null, busy = false, gen = 0, current = null, hints = false;
let mode = null, give = [0, 0, 0, 0, 0], get = [0, 0, 0, 0, 0], bankGive = null, bankGet = null, chosen = [0, 0, 0, 0, 0], dismissed = null, picks = [];
const yours = () => view && !busy && view.toAct === view.human && view.winner == null;
const movesOf = kind => view.moves.filter(m => m.kind === kind);
const moveOf = (kind, test = () => true) => view.moves.find(m => m.kind === kind && test(m));
const who = seat => seat === view.human ? "You" : NAMES[seat];
const rel = seat => (seat - view.human + view.players) % view.players;
const posOf = seat => view.players === 2 ? (rel(seat) ? 2 : 0) : rel(seat);
const seatOf = (v, seat) => v.seats.find(s => s.seat === seat);
const copy = v => ({ ...v, hand: v.hand.slice(), devCards: v.devCards.slice(), bank: v.bank.slice(), seats: v.seats.map(s => ({ ...s })) });

// ---- Loading: the engine once, each checkpoint's weights when first chosen.
const cache = {};
let engine = null, tables = null;
async function load(name) {
  if (!engine) {
    const [wasm, t] = await Promise.all([fetch("./play/catan.wasm").then(r => r.arrayBuffer()), fetch("./play/tables.json").then(r => r.json())]);
    engine = await loadEngine(wasm); tables = t; useKernel(engine.kernel);
  }
  if (!cache[name]) {
    const [manifest, raw] = await Promise.all([fetch(`./play/weights-${name}.json`).then(r => r.json()), fetch(`./play/weights-${name}.bin`).then(r => r.arrayBuffer())]);
    cache[name] = { manifest, weights: loadWeights(manifest, raw) };
  }
  return cache[name];
}

// ---- Start and end screens.
const MODES = [["2p", "1 v 1", "First to 15. No trading between players."], ["4p", "4 players", "You and three networks. First to 10."]];
function showStart(picked = null, seats = 0, loading = "") {
  const box = el("div", { class: "box" }, [
    el("h2", { text: "Play against the trained network" }),
    el("p", { text: "Runs in your browser. It can't see your cards." }),
    el("div", { class: "modes" }, MODES.map(([key, title, about]) =>
      el("button", { class: "mode" + (picked === key ? " on" : ""), on: { click: () => chooseMode(key) } }, [el("b", { text: title }), el("small", { text: about })]))),
    seats ? el("h4", { text: "Your seat (Blue goes first)" }) : null,
    seats ? el("div", { class: "seats" }, [...Array.from({ length: seats }, (_, s) =>
      el("button", { class: "seat", on: { click: () => begin(s) } }, [el("i", { style: `background:var(--p${s})` }), NAMES[s], el("small", { text: ["1st", "2nd", "3rd", "4th"][s] })])),
      el("button", { class: "seat", on: { click: () => begin(null) } }, ["Random"])]) : null,
    el("div", { class: "loading", text: loading }),
  ]);
  $("screen").replaceChildren(box); $("screen").classList.add("show");
}
async function chooseMode(name) {
  showStart(name, 0, "Loading the network");
  const { manifest, weights } = await load(name);
  current = name;
  session = new Session(engine, weights, tables, { players: manifest.players, rules: manifest.rules, temperature: 0.8 });
  showStart(name, manifest.players);
}
function begin(seat) { $("screen").classList.remove("show"); newGame(seat); }
function showOver() {
  const final = session.finalPoints(), standings = view.seats.map(s => ({ ...s, points: final[s.seat] })).sort((a, b) => b.points - a.points);
  $("screen").replaceChildren(el("div", { class: "box" }, [
    el("h2", { text: view.winner === view.human ? "You won." : `${NAMES[view.winner]} won.` }),
    el("div", { class: "standings" }, standings.map(s => el("div", {}, [el("i", { style: `background:var(--p${s.seat})` }), s.you ? `You (${s.name})` : s.name, el("b", { text: s.points })]))),
    el("button", { class: "primary", text: "Play again", on: { click: () => showStart(current, session.config.players) } }),
  ]));
  $("screen").classList.add("show");
}

// ---- The board: drawn once per game, then changed piece by piece.
const scene = {};
function buildBoard() {
  const svg = $("board"), g = view.geometry, b = view.board;
  svg.replaceChildren();
  const vs = g.vertices.map(pt), hs = g.hexes.map(pt);
  scene.vs = vs; scene.hs = hs;
  const xs = vs.map(p => p[0]), ys = vs.map(p => p[1]), pad = R * 1.15;
  svg.setAttribute("viewBox", `${Math.min(...xs) - pad} ${Math.min(...ys) - pad} ${Math.max(...xs) - Math.min(...xs) + 2 * pad} ${Math.max(...ys) - Math.min(...ys) + 2 * pad}`);
  const layer = name => { const l = el("svg:g", { class: name }); svg.append(l); return l; };
  const poly = (h, k = 1) => g.corners[h].map(v => { const [x, y] = vs[v], [cx, cy] = hs[h]; return [cx + (x - cx) * k, cy + (y - cy) * k].join(","); }).join(" ");
  // The sea: every hex grown, outlined once and filled once, so the outline follows the island.
  const sea = layer("sea");
  g.corners.forEach((_, h) => sea.append(el("svg:polygon", { points: poly(h, 1.72), fill: INK, stroke: INK, "stroke-width": 6, "stroke-linejoin": "round" })));
  g.corners.forEach((_, h) => sea.append(el("svg:polygon", { points: poly(h, 1.72), fill: css("--sea"), stroke: css("--sea"), "stroke-width": 1, "stroke-linejoin": "round" })));
  // Harbours, on the water by their two corners.
  const harbors = layer("harbors");
  for (const e of g.coast) {
    const [a, c] = g.edges[e], ha = b.harbors[a];
    if (!ha || ha !== b.harbors[c]) continue;
    const mx = (vs[a][0] + vs[c][0]) / 2, my = (vs[a][1] + vs[c][1]) / 2, len = Math.hypot(mx, my), ox = mx + mx / len * R * .55, oy = my + my / len * R * .55;
    for (const v of [a, c]) harbors.append(el("svg:line", { x1: vs[v][0], y1: vs[v][1], x2: ox, y2: oy, stroke: INK, "stroke-width": 2, "stroke-dasharray": "3 3" }));
    const r = RES.indexOf(ha);
    harbors.append(el("svg:rect", { x: ox - 14 + 2, y: oy - 9 + 2, width: 28, height: 18, fill: INK }));
    harbors.append(el("svg:rect", { x: ox - 14, y: oy - 9, width: 28, height: 18, fill: r >= 0 ? RCOLOR(r) : CARD, stroke: INK, "stroke-width": 2 }));
    harbors.append(el("svg:text", { x: ox, y: oy + 4, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: INK, text: r >= 0 ? "2:1" : "3:1" }));
  }
  const hexes = layer("hexes"), tokens = layer("tokens");
  scene.hex = []; scene.tok = [];
  b.terrain.forEach((t, h) => {
    const [x, y] = hs[h];
    const node = el("svg:g", { class: "hex" }, [
      el("svg:polygon", { points: poly(h), fill: css(TERRAIN[t]), stroke: INK, "stroke-width": 2.5, "stroke-linejoin": "round" }),
      el("svg:polygon", { class: "lit", points: poly(h, .92), fill: "#fff" }),
      el("svg:polygon", { class: "blocked", points: poly(h, .92), fill: "url(#hatch)", opacity: 0 }),
    ]);
    if (t in TERRAIN_RES) node.append(el("svg:use", { href: `#g-${RES[TERRAIN_RES[t]]}`, x: x - 8, y: y - 37, width: 16, height: 16, fill: INK, opacity: .42 }));
    hexes.append(node); scene.hex[h] = node;
    const n = b.tokens[h];
    if (n) {
      const hot = n === 6 || n === 8, pips = 6 - Math.abs(7 - n), color = hot ? "#c0392b" : INK;
      const tok = el("svg:g", { class: "tok" }, [el("svg:circle", { cx: x, cy: y, r: 15.5, fill: CARD, stroke: INK, "stroke-width": 2 }),
        el("svg:text", { x, y: y + 4, "text-anchor": "middle", "font-size": 15, "font-weight": 800, fill: color, text: n })]);
      for (let i = 0; i < pips; i++) tok.append(el("svg:rect", { x: x + (i - (pips - 1) / 2) * 4 - 1.2, y: y + 7.5, width: 2.4, height: 2.4, fill: color }));
      tokens.append(tok); scene.tok[h] = tok;
    }
  });
  scene.rghosts = layer("ghosts rg");
  scene.roadCase = layer("road-case"); scene.roads = layer("roads"); scene.buildings = layer("buildings");
  scene.robber = el("svg:g", { class: "robber" }, [el("svg:g", { class: "body" }, pawn(INK))]);
  layer("robber-layer").append(scene.robber);
  scene.ghosts = layer("ghosts"); scene.marks = layer("marks");
  scene.robberAt = null;
  syncBoard(view);
}
// Where the robber stands on a hex: left of the number, so the number stays readable.
const robberSpot = h => { const [x, y] = scene.hs[h]; return [x - 25, y + 10]; };
const pawn = (fill, stroke = PAPER) => [el("svg:path", { d: "M-8 0h16l-2.5-5-2.5-8h-6l-2.5 8z", fill, stroke, "stroke-width": 1.8, "stroke-linejoin": "round" }),
  el("svg:circle", { cx: 0, cy: -18, r: 5.5, fill, stroke, "stroke-width": 1.8 })];
const HOUSE = "-11,9 11,9 11,-3 0,-13 -11,-3", CITY = "-15,10 15,10 15,-4 4,-4 4,-8 -5.5,-17 -15,-8";
function piece(kind, at, seat, ghost = false) {
  const color = COLOR(seat);
  if (kind === "road") {
    const [a, c] = view.geometry.edges[at], [x1, y1] = scene.vs[a], [x2, y2] = scene.vs[c];
    const k = ghost ? .2 : 0, ax = x1 + (x2 - x1) * k, ay = y1 + (y2 - y1) * k, bx = x2 - (x2 - x1) * k, by = y2 - (y2 - y1) * k;
    const line = (attrs) => el("svg:line", { x1: ax, y1: ay, x2: bx, y2: by, pathLength: 1, ...attrs });
    const kids = ghost ? [line({ stroke: "transparent", "stroke-width": 18 }), line({ stroke: INK, "stroke-width": 8 }), line({ class: "gr", stroke: CARD, "stroke-width": 3.5 })]
      : [line({ class: "case", stroke: INK, "stroke-width": 11, "stroke-linecap": "round" }), line({ stroke: color, "stroke-width": 5.5, "stroke-linecap": "round" })];
    return el("svg:g", { class: ghost ? "ghost" : "piece", "data-key": `road-${at}`, style: `--c:${color}` }, kids);
  }
  const [x, y] = scene.vs[at], shape = kind === "city" ? CITY : HOUSE;
  const body = el("svg:g", { class: "body" }, [
    ghost ? el("svg:circle", { r: 15, fill: "transparent" }) : el("svg:polygon", { points: shape, fill: INK, transform: "translate(2.5 2.5)" }),
    ghost ? el("svg:rect", { class: "gm", x: -4.5, y: -4.5, width: 9, height: 9, fill: CARD, stroke: INK, "stroke-width": 2, transform: "rotate(45)" }) : null,
    el("svg:polygon", { class: ghost ? "gb" : null, points: shape, fill: color, stroke: INK, "stroke-width": 2, "stroke-linejoin": "miter" }),
  ]);
  return el("svg:g", { class: ghost ? "ghost" : "piece", "data-key": `${kind}-${at}`, transform: `translate(${x} ${y})` }, [body]);
}
// Make the board match a view, without animation: add what's missing, remove what's gone, put the robber in place.
function addPiece(node, kind) {
  if (kind !== "road") return scene.buildings.append(node);
  const casing = node.querySelector(".case");
  scene.roadCase.append(el("svg:g", { "data-key": node.dataset.key }, [casing]));
  scene.roads.append(node);
}
function syncBoard(v) {
  const want = new Map();
  v.board.roads.forEach(r => want.set(`road-${r.edge}`, ["road", r.edge, r.seat]));
  v.board.settlements.forEach(s => want.set(`settlement-${s.vertex}`, ["settlement", s.vertex, s.seat]));
  v.board.cities.forEach(c => want.set(`city-${c.vertex}`, ["city", c.vertex, c.seat]));
  for (const layer of [scene.roadCase, scene.roads, scene.buildings]) for (const node of [...layer.children]) if (!want.has(node.dataset.key)) node.remove();
  for (const [key, [kind, at, seat]] of want) if (!$("board").querySelector(`.piece[data-key="${key}"]`)) addPiece(piece(kind, at, seat), kind);
  placeRobber(v.board.robber);
}
function placeRobber(h) {
  const [x, y] = robberSpot(h);
  scene.robber.style.transform = `translate(${x}px, ${y}px)`;
  if (scene.robberAt !== h) {
    if (scene.robberAt != null) scene.hex[scene.robberAt].querySelector(".blocked").setAttribute("opacity", 0);
    scene.hex[h].querySelector(".blocked").setAttribute("opacity", .22);
    scene.robberAt = h;
  }
}

// What you can click on the board right now: ghost pieces in your colour, the robber's possible hexes.
function drawGhosts() {
  const layer = scene.ghosts;
  layer.replaceChildren(); scene.rghosts.replaceChildren(); scene.marks.replaceChildren();
  $("board").classList.remove("picking");
  if (!yours()) return;
  const phase = view.phase, showing = kind => mode === kind || (["place settlement", "place road", "road building"].includes(phase) && ["settlement", "road"].includes(kind))
    || (phase === "move robber" && kind === "robber");
  let any = false;
  for (const kind of ["road", "settlement", "city"]) if (showing(kind)) for (const m of movesOf(kind)) {
    const g = piece(kind, m.edge ?? m.vertex, view.human, true);
    g.addEventListener("click", () => act(m.code));
    layer.append(g); any = true;
  }
  if (showing("robber")) for (const m of movesOf("robber")) {
    const [x, y] = robberSpot(m.hex), corners = view.geometry.corners[m.hex].map(v => scene.vs[v].join(",")).join(" ");
    scene.rghosts.append(el("svg:g", { class: "ghost robber-g", on: { click: () => act(m.code) } }, [
      el("svg:polygon", { class: "gb", points: corners, fill: INK }),
      el("svg:g", { class: "pawn", transform: `translate(${x} ${y})` }, pawn(INK)),
    ]));
    any = true;
  }
  if (any) $("board").classList.add("picking");
  // The network's choice, with its view on: a small ink marker over the spot.
  const hint = hints && view.insight && view.insight.hint;
  if (hint) {
    let at = null;
    if (hint.vertex != null) at = scene.vs[hint.vertex];
    if (hint.edge != null) { const [a, c] = view.geometry.edges[hint.edge]; at = [(scene.vs[a][0] + scene.vs[c][0]) / 2, (scene.vs[a][1] + scene.vs[c][1]) / 2]; }
    if (hint.hex != null) at = scene.hs[hint.hex];
    if (at) scene.marks.append(el("svg:g", { transform: `translate(${at[0]} ${at[1] - 20})`, "pointer-events": "none" }, [
      el("svg:polygon", { points: "-6,-8 6,-8 0,0", fill: INK, stroke: PAPER, "stroke-width": 1.5 })]));
  }
}

// ---- Seats.
function drawPlates() {
  const box = $("plates");
  const toAct = view.winner == null ? view.toAct : null;
  const victims = yours() && view.phase === "choose victim" ? movesOf("rob") : [];
  const board = view.offerBoard, live = board && !board.result;
  const nodes = disp.seats.map(s => {
    const old = box.querySelector(`.plate[data-seat="${s.seat}"]`);
    const rob = victims.find(m => m.seat === s.seat);
    const cls = ["plate", `pos-${posOf(s.seat)}`, s.seat === view.current && view.winner == null ? "turn" : "", toAct === s.seat && toAct !== view.human ? "thinking" : "",
      rob ? "pickable" : ""].filter(Boolean).join(" ");

  box.classList.remove("old", "seven");
  const a = Math.max(1, sum - 6) + Math.floor(Math.random() * (Math.min(6, sum - 1) - Math.max(1, sum - 6) + 1)), faces = [a, sum - a];
  if (reduced) { dice.forEach((d, i) => face(d, faces[i])); return; }
  let flick = setInterval(() => dice.forEach(d => face(d, 1 + Math.floor(Math.random() * 6))), T(70));
  await Promise.all(dice.map((d, i) => anim(d, [{ transform: "translateY(-22px) rotate(-200deg)" }, { transform: `translateY(-30px) rotate(${-90 + i * 30}deg)`, offset: .45 },
    { transform: "translateY(0) rotate(0) scale(1.12, .85)", offset: .85 }, { transform: "none" }], 520, "ease-out", { delay: i * 50 })));
  clearInterval(flick);
  dice.forEach((d, i) => face(d, faces[i]));
  if (sum === 7) box.classList.add("seven");
  await sleep(T(120));
}
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function face(die, n) { if (!die.children.length) for (let i = 0; i < 9; i++) die.append(el("i")); [...die.children].forEach((p, i) => p.classList.toggle("on", PIPS[n].includes(i))); }

async function payout(f) {
  // The hexes that pay light up and their numbers rise; then each card arcs to whoever earned it.
  const lits = f.hexes.map(h => scene.hex[h].querySelector(".lit")), toks = f.hexes.map(h => scene.tok[h]).filter(Boolean);
  lits.forEach(l => anim(l, [{ opacity: 0 }, { opacity: .5 }], 160));
  toks.forEach(t => anim(t, [{ transform: "scale(1)" }, { transform: "scale(1.3)" }], 200, LAND));
  if (f.hexes.length) await sleep(T(220));
  let k = 0;
  const flights = [];
  for (const { seat, hex, resource, count } of f.cards) for (let c = 0; c < count; c++, k++) {
    const from = boardPoint(scene.hs[hex]);
    flights.push(fly(from, slotOf(seat, resource), { res: resource, delay: 70 * k,
      land: () => { addCards(seat, resource, 1); disp.bank[resource] -= 1; redrawCounts(); } }));
  }
  await Promise.all(flights);
  lits.forEach(l => anim(l, [{ opacity: .5 }, { opacity: 0 }], 200, IN));
  toks.forEach(t => anim(t, [{ transform: "scale(1.3)" }, { transform: "scale(1)" }], 200, IN));
  if (f.hexes.length) await sleep(T(120));
}
// Cards leaving a seat for the bank, one arc each.
async function spend(seat, counts, back = false) {
  const flights = [];
  let k = 0;
  counts.forEach((n, r) => { for (let i = 0; i < n; i++, k++) {
    const from = centre(slotOf(seat, r));
    addCards(seat, r, -1); flights.push(fly(from, bankSlot(r), { res: r, back, delay: 60 * k, land: () => { disp.bank[r] += 1; drawBank(); } }));
  } });
  redrawCounts();
  await Promise.all(flights);
}
async function drop(kind, at, seat) {
  if (kind === "city") { const old = scene.buildings.querySelector(`[data-key="settlement-${at}"]`); if (old) { await anim(old.firstChild, [{ transform: "none" }, { transform: "scale(0)" }], 120, IN); old.remove(); } }
  const node = piece(kind, at, seat);
  if (kind === "road") {
    const lines = [node.querySelector(".case"), ...node.querySelectorAll("line:not(.case)")];
    addPiece(node, kind);
    lines.forEach(l => { l.style.strokeDasharray = "1"; });
    await Promise.all(lines.map(l => anim(l, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], 240, OUT)));
    lines.forEach(l => { l.style.strokeDasharray = ""; });
  } else {
    addPiece(node, kind);
    await anim(node.firstChild, [{ transform: "translateY(-26px)", opacity: 0 }, { transform: "translateY(0) scale(1.18, .78)", opacity: 1, offset: .6 },
      { transform: "translateY(-3px) scale(.95, 1.06)", offset: .8 }, { transform: "none", opacity: 1 }], 380, "ease-out");
  }
}
async function moveRobber(h) {
  const from = robberSpot(scene.robberAt), to = robberSpot(h), body = scene.robber.firstChild;
  if (scene.robberAt === h) return;
  await anim(body, [{ transform: "none" }, { transform: "translateY(-6px) scale(1.08, .9)" }], 120, OUT);
  const frames = [];
  for (let i = 0; i <= 12; i++) { const t = i / 12, e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    frames.push({ transform: `translate(${from[0] + (to[0] - from[0]) * e}px, ${from[1] + (to[1] - from[1]) * e - 60 * 4 * e * (1 - e)}px)`, offset: t }); }
  await anim(scene.robber, frames, 480, "linear");
  placeRobber(h); scene.robber.getAnimations().forEach(a => a.cancel());
  await anim(body, [{ transform: "translateY(-6px)" }, { transform: "scale(1.2, .75)", offset: .5 }, { transform: "none" }], 200, "ease-out");
}
async function showcase(seat, card) {
  const box = $("show");
  box.replaceChildren(el("div", { class: "band", style: `background:var(--p${seat})` }), glyph(card.replace(/ /g, "-")), el("b", { text: DEV_TITLE[card] }), el("small", { text: `${who(seat)} played it` }));
  box.style.display = "flex";
  await anim(box, [{ transform: "scale(.5) translateY(40px)", opacity: 0 }, { transform: "scale(1.06)", opacity: 1, offset: .7 }, { transform: "none", opacity: 1 }], 320);
  await sleep(T(650));
  await anim(box, [{ opacity: 1 }, { transform: "scale(.9)", opacity: 0 }], 200, IN);
  box.style.display = "none"; box.getAnimations().forEach(a => a.cancel());
}

async function play(f, before, after) {
  const human = view.human;
  switch (f.type) {
    case "roll": await rollDice(f.sum); rolled = { seat: f.seat, sum: f.sum }; drawRolled();
      if (f.sum === 7) await anim(scene.robber.firstChild, [{ transform: "none" }, { transform: "translateY(-10px)", offset: .4 }, { transform: "none" }], 320, "ease-out");
      break;
    case "payout": await payout(f); break;
    case "build": if (!f.free) await spend(f.seat, COST[f.kind], f.seat !== human); await drop(f.kind, f.at, f.seat); break;
    case "robber": await moveRobber(f.hex); break;
    case "steal": {
      const from = centre(slotOf(f.from, f.res)); addCards(f.from, f.res, -1); redrawCounts();
      await fly(from, slotOf(f.to, f.res), { res: f.res, back: f.res == null, land: () => { addCards(f.to, f.res, 1); redrawCounts(); } });
      break;
    }
    case "buy": await spend(f.seat, COST.card, f.seat !== human);
      disp.deck -= 1; drawBank();
      await fly(centre(bankSlot(null)), f.seat === human ? $("devs").lastChild || $("hand").lastChild : plateOf(f.seat)?.querySelector(".devs"), { dev: f.card != null ? DEV[f.card][0] : true,
        land: () => { seatDisp(f.seat).devCards += 1; if (f.card != null) disp.devCards[f.card] += 1; redrawCounts(); } });
      break;
    case "discard": { const from = centre(slotOf(f.seat, f.res)); addCards(f.seat, f.seat === human ? f.res : null, -1); redrawCounts();
      await fly(from, bankSlot(f.res), { res: f.res, back: f.seat !== human, land: () => { disp.bank[f.res] += 1; drawBank(); } }); break; }
    case "take": disp.bank[f.res] -= 1; drawBank();
      await fly(centre(bankSlot(f.res)), slotOf(f.seat, f.res), { res: f.res, land: () => { addCards(f.seat, f.res, 1); redrawCounts(); } }); break;
    case "monopoly": {
      const flights = [];
      for (const s of before.seats) if (s.seat !== f.seat) {
        const n = s.cards - seatOf(after, s.seat).cards;
        for (let i = 0; i < n; i++) { const from = centre(slotOf(s.seat, f.res)); addCards(s.seat, s.seat === human ? f.res : null, -1);
          flights.push(fly(from, slotOf(f.seat, f.res), { res: f.res, delay: 70 * i, land: () => { addCards(f.seat, f.res, 1); redrawCounts(); } })); }
      }
      redrawCounts(); await Promise.all(flights); break;
    }
    case "bank": {
      const n = f.seat === human ? before.rates[f.give] : Math.max(1, seatOf(before, f.seat).cards - seatOf(after, f.seat).cards + 1);
      const counts = [0, 0, 0, 0, 0]; counts[f.give] = n;
      await spend(f.seat, counts);
      disp.bank[f.get] -= 1; drawBank();
      await fly(centre(bankSlot(f.get)), slotOf(f.seat, f.get), { res: f.get, land: () => { addCards(f.seat, f.get, 1); redrawCounts(); } });
      break;
    }
    case "play": {
      const c = DEV.findIndex(d => d[2] === `play ${f.card}`);
      if (f.seat === human && c >= 0) disp.devCards[c] -= 1;
      seatDisp(f.seat).devCards -= 1; redrawCounts();
      await showcase(f.seat, f.card); break;
    }
    case "trade": {
      const flights = [];
      const send = (a, b, counts) => counts.forEach((n, r) => { for (let i = 0; i < n; i++) { const from = centre(slotOf(a, r)); addCards(a, r, -1);
        flights.push(fly(from, slotOf(b, r), { res: r, delay: 70 * flights.length, land: () => { addCards(b, r, 1); redrawCounts(); } })); } });
      send(f.a, f.b, f.aGives); send(f.b, f.a, f.bGives); redrawCounts();
      await Promise.all(flights); break;
    }
  }
}

// Move the game on (your move, or the network's), then show what happened, in order.
async function advance(mutate) {
  const g = gen, before = view;
  busy = true; render();
  try { mutate(); } catch (e) { console.warn(e); }
  const after = session.view(), fx = session.drain();
  // The offer board changes with no effect to play: show it straight away so answers appear as they come.
  view = { ...before, offerBoard: after.offerBoard, events: after.events, toAct: before.toAct };
  drawOffer(); drawPlates(); drawLog(); drawPrompt();
  for (const f of fx) { if (g !== gen) return; await play(f, before, after); }
  if (g !== gen) return;
  view = after; disp = copy(after);
  syncBoard(view);
  busy = false;
  if (after.current !== before.current && !fx.some(f => f.type === "roll")) $("dice").classList.add("old");
  render();
  if (view.winner != null) { await sleep(T(600)); if (g === gen) showOver(); return; }
  // A beat when the turn passes, so one player's turn doesn't run straight into the next.
  if (after.current !== before.current) await sleep(T(450));
}
async function act(code, deal, many) {
  if (busy || !yours()) return;
  mode = null; bankGive = bankGet = null;
  await advance(many || (() => session.act(code, deal || undefined)));
  runNetwork();
}
async function runNetwork() {
  const g = gen;
  while (g === gen && view && view.winner == null && view.toAct != null && view.toAct !== view.human) {
    drawPlates();
    await sleep(T(380));
    if (g !== gen) return;
    await advance(() => session.step());
  }
}

function newGame(seat) {
  gen += 1; busy = false;
  $("fly").replaceChildren();
  session.new(undefined, seat ?? undefined); session.drain();
  view = session.view(); disp = copy(view);
  mode = null; dismissed = null; chosen = [0, 0, 0, 0, 0]; rolled = null;
  [...$("dice").children].forEach(d => face(d, 1)); $("dice").classList.add("old");
  buildBoard(); render();
  runNetwork();
}

// ---- Controls.
$("pace").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pace = +b.dataset.pace; [...$("pace").children].forEach(x => x.classList.toggle("on", x === b)); });
$("viewbtn").addEventListener("click", () => { hints = !hints; $("viewbtn").classList.toggle("on", hints); render(); });
$("logbtn").addEventListener("click", () => $("log").classList.toggle("open"));
$("logclose").addEventListener("click", () => $("log").classList.remove("open"));
$("newgame").addEventListener("click", () => { gen += 1; showStart(current, current ? session.config.players : 0); });
$("full").addEventListener("click", () => {
  if (document.fullscreenElement) return document.exitFullscreen();
  if (document.fullscreenEnabled) document.documentElement.requestFullscreen().catch(() => window.open(location.href, "_blank"));
  else window.open(location.href, "_blank");
});
document.addEventListener("fullscreenchange", () => { $("full").firstChild.firstChild.setAttribute("href", document.fullscreenElement ? "#i-exit" : "#i-full"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && view && mode) { mode = null; render(); } });
let resizing;
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(() => view && render(), 100); });

const auto = new URLSearchParams(location.search).get("mode");
showStart();
if (auto === "2p" || auto === "4p") chooseMode(auto).then(() => begin(0));
</script>
