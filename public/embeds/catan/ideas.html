<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catan what was tried</title>
<style>
* { box-sizing: border-box; }
html, body { overflow: hidden; }
body { margin: 0; padding: 8px; background: transparent; color: #1f2937; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.row { display: grid; grid-template-columns: 1.35fr 1fr; gap: 36px; max-width: 860px; margin: 0 auto; }
.h { font-weight: 600; font-size: 12.5px; }
.h small { display: block; font: 10.5px ui-monospace, Menlo, monospace; color: #9ca3af; font-weight: 400; }
svg { width: 100%; display: block; margin-top: 6px; }
svg text { font: 10px ui-monospace, Menlo, monospace; fill: #9ca3af; }
svg text.lab { font: 11.5px system-ui, -apple-system, sans-serif; fill: #374151; }
svg text.v { font: 600 11px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="row">
  <div><div class="h">Changes to training<small>won against three bots after a short run</small></div><svg id="a"></svg></div>
  <div><div class="h">Searching before each move<small>won in 4-player games against the network</small></div><svg id="b"></svg></div>
</div>
<script>
// Short 4-player runs that each change one thing, and search at play time, read from the runs' logs.
const D = {"ablations": {"plain": [[20, 247, 0.0, 0.0], [40, 745, 0.0, 0.0], [60, 1429, 0.059, 0.0], [80, 1967, 0.251, 0.008], [100, 2534, 0.727, 0.049], [120, 3147, 0.869, 0.12], [140, 3829, 0.873, 0.129], [160, 4492, 0.928, 0.168], [180, 5092, 0.965, 0.201], [200, 5689, 0.984, 0.199], [220, 6186, 0.996, 0.219], [240, 6782, 0.996, 0.244], [260, 7312, 0.998, 0.275], [280, 7886, 0.984, 0.315], [300, 8444, 0.998, 0.381]], "board symmetry": [[20, 247, 0.014, 0.0], [40, 742, 0.0, 0.0], [60, 1416, 0.002, 0.0], [80, 2094, 0.141, 0.0], [100, 2776, 0.099, 0.0], [120, 3393, 0.209, 0.004], [140, 4039, 0.344, 0.014], [160, 4720, 0.492, 0.023], [180, 5399, 0.688, 0.045], [200, 6043, 0.834, 0.049], [220, 6718, 0.745, 0.033], [240, 7396, 0.684, 0.027], [260, 8028, 0.708, 0.045], [280, 8709, 0.623, 0.041], [300, 9391, 0.709, 0.051]], "critic that sees hidden cards": [[20, 237, 0.175, 0.002], [40, 571, 0.264, 0.0], [60, 963, 0.619, 0.018], [80, 1361, 0.984, 0.108], [100, 1759, 0.994, 0.088], [120, 2182, 0.996, 0.098], [140, 2614, 0.992, 0.061], [160, 3040, 0.99, 0.086], [180, 3459, 0.977, 0.107], [200, 3865, 0.982, 0.088], [220, 4265, 0.977, 0.102], [240, 4701, 0.994, 0.108], [260, 5120, 0.973, 0.139], [280, 5541, 0.959, 0.115], [300, 5969, 0.941, 0.092]], "expert iteration (search targets)": [[20, 549, 0.034, 0.0], [40, 1386, 0.135, 0.002], [60, 2399, 0.568, 0.002], [80, 3348, 0.765, 0.014], [100, 4362, 0.796, 0.025], [120, 5334, 0.904, 0.039], [140, 6295, 0.961, 0.061], [160, 7300, 0.961, 0.051], [180, 8237, 0.977, 0.059]], "average over dice rolls": [[20, 260, 0.004, 0.0], [40, 621, 0.053, 0.0], [60, 1084, 0.135, 0.002], [80, 1510, 0.157, 0.008], [100, 1975, 0.275, 0.0], [120, 2435, 0.502, 0.018], [140, 2897, 0.627, 0.025], [160, 3359, 0.687, 0.047], [180, 3811, 0.743, 0.039], [200, 4265, 0.773, 0.047], [220, 4727, 0.75, 0.061], [240, 5183, 0.729, 0.08], [260, 5643, 0.699, 0.074], [280, 6101, 0.608, 0.023]]}, "belief": [[2000, 0.812, 0.821, 1.226, 1.459], [4000, 0.882, 0.821, 1.554, 1.459], [6000, 0.948, 0.821, 1.858, 1.459], [8000, 0.992, 0.821, 2.069, 1.459], [10000, 1.031, 0.821, 2.265, 1.459], [12000, 1.075, 0.821, 2.474, 1.459], [14000, 1.103, 0.821, 2.619, 1.459], [16000, 1.133, 0.821, 2.75, 1.459], [18000, 1.143, 0.821, 2.797, 1.459], [20000, 1.146, 0.821, 2.809, 1.459]], "search": [["searching vs the plain network", 0.385, 0.022], ["searching with guessed hands vs the plain network", 0.426, 0.022], ["searching with guessed hands vs plain searching", 0.258, 0.019]], "h2h": [["board symmetry vs plain", 0.023, 0.003], ["hidden-card critic vs plain", 0.054, 0.005]], "anneal": [0.504, 0.011]};
const NS = "http://www.w3.org/2000/svg";
const add = (svg, tag, a, text) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (text !== undefined) n.textContent = text; svg.appendChild(n); return n; };
function bars(id, rows, W, LX) {
  const svg = document.getElementById(id), RH = 26, H = rows.length * RH + 26, X0 = LX, X1 = W - 50, x = v => X0 + (X1 - X0) * v / 0.45;
  [0, 0.2, 0.4].forEach(v => add(svg, "text", { x: x(v), y: H - 2, "text-anchor": "middle" }, `${Math.round(100 * v)}%`));
  rows.forEach(([name, v, hi], k) => { const y = 6 + k * RH;
    add(svg, "text", { x: X0 - 10, y: y + 13, "text-anchor": "end", class: "lab", style: hi ? "fill:#111;font-weight:600" : "" }, name);
    add(svg, "rect", { x: X0, y: y + 3, width: x(v) - X0, height: 14, rx: 2, fill: hi ? "#b45309" : "#cbd5e1" });
    add(svg, "text", { x: x(v) + 6, y: y + 14, class: "v", style: `fill:${hi ? "#b45309" : "#475569"}` }, `${Math.round(100 * v)}%`); });
  add(svg, "line", { x1: x(0.25), x2: x(0.25), y1: 2, y2: H - 14, stroke: "#9ca3af", "stroke-dasharray": "3 3" });
  add(svg, "text", { x: x(0.25) + 4, y: H - 14 }, "even");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
}
const A = D.ablations, last = n => A[n][A[n].length - 1][3];
bars("a", [["plain", last("plain"), 1], ["critic that sees every hand", last("critic that sees hidden cards")], ["training toward search", last("expert iteration (search targets)")],
           ["board symmetry", last("board symmetry")], ["averaging over the dice", last("average over dice rolls")]], 470, 190);
bars("b", [["network alone", 0.25], ["searching", D.search[0][1], 1]], 340, 110);
if (window.frameElement) new ResizeObserver(() => { window.frameElement.style.height = document.body.offsetHeight + "px"; }).observe(document.body);
</script>
