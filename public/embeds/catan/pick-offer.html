<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catan offer</title>
<style>
* { box-sizing: border-box; }
html, body { overflow: hidden; }
body { margin: 0; padding: 8px; background: transparent; color: #1f2937; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.left { flex: 0 1 300px; }
.right { flex: 1 1 500px; }
.strip { display: flex; height: 18px; border-radius: 3px; overflow: hidden; }
.strip i { flex: 1; }
.lab { font-size: 12px; color: #4b5563; margin-top: 4px; }
.lab b { font: 10.5px ui-monospace, Menlo, monospace; color: #9ca3af; font-weight: 400; margin-left: 4px; }
.flow { display: flex; align-items: center; gap: 6px; margin: 10px 0; font: 10.5px ui-monospace, Menlo, monospace; color: #9ca3af; flex-wrap: wrap; }
.flow span { padding: 1px 8px; border: 1.2px solid #9ca3af; border-radius: 4px; background: #fff; }
.gap { height: 12px; }
.head { font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.toggle { font-weight: 400; font-size: 12px; color: #374151; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
.toggle i { width: 26px; height: 14px; border-radius: 7px; background: #d1d5db; position: relative; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle.on i { background: #111; }
.toggle.on i::after { left: 14px; }
.deal { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; font-size: 12px; color: #6b7280; }
.deal i { width: 12px; height: 17px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, .15); }
.grid { display: grid; grid-template-columns: 92px repeat(5, 1fr); gap: 4px; }
.rl { font-size: 11.5px; color: #6b7280; display: flex; align-items: center; }
.k { border-radius: 4px; padding: 5px 7px; background: color-mix(in srgb, var(--c) 22%, transparent); transition: background .25s; }
.k .nm { font-size: 11.5px; color: #374151; }
.k .v { font: 600 11px ui-monospace, Menlo, monospace; color: #6b7280; height: 15px; }
.k.pick { outline: 2px solid #111; }
.grid.masked .k { background: #f3f4f6; }
.grid.masked .k .nm, .grid.masked .k .v { color: #c4c8cf; }
.grid.masked .k.n { background: var(--c); }
.grid.masked .k.n .nm, .grid.masked .k.n .v { color: var(--t); }
</style>
</head>
