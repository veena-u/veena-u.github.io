label(SX, G + N + 14, "Scores ÷ √32", "155 × 155");
op(SX + 172, G + 82, "+");
label(BX, G - 16, "Bonus for how they're related");
heat(BX, G, shade.bonus);
add(fig, "text", { x: BX, y: G + N + 14, class: "dim" }, "155 × 155");
add(fig, "text", { x: BX + 187, y: G + 70, "text-anchor": "middle", class: "dim" }, "softmax");
add(fig, "text", { x: BX + 187, y: G + 86, "text-anchor": "middle", class: "op" }, "→");
label(WX, G - 16, "Percentages");
heat(WX, G, shade.weight);
add(fig, "text", { x: WX, y: G + N + 14, class: "dim" }, "155 × 155");
op(WX + 167, G + 82, "×");
label(VX1, G - 16, "Values");
rows(VX1, G, 32, VC);
add(fig, "text", { x: VX1, y: G + N + 14, class: "dim" }, "155 × 32");
op(VX1 + 44, G + 82, "=");
label(OX, G - 16, "Output");
rows(OX, G, 32, OC);
add(fig, "text", { x: OX, y: G + N + 14, class: "dim" }, "155 × 32");

// 3. One row up close: what it scores, how the bonus shifts that, where its attention lands, and whose values it takes.
const C = G + N + 76, CX = 130, CW = 820 / N;
const title = add(fig, "text", { x: 20, y: C - 10, class: "big" });
const strips = [["Score", shade.score], ["+ bonus", shade.bonus], ["softmax → %", shade.weight]];
const stripCells = strips.map(([name, scale], s) => {
  add(fig, "text", { x: CX - 10, y: C + s * 20 + 11, "text-anchor": "end" }, name);
  return Array.from({ length: N }, (_, j) => add(fig, "rect", { x: CX + j * CW, y: C + s * 20, width: CW + 0.3, height: 14 }));
});
KINDS.forEach(k => {
  add(fig, "rect", { x: CX + k.at * CW, y: C + 62, width: k.rows * CW - 1, height: 4, fill: k.color });
  if (k.rows > 4) add(fig, "text", { x: CX + (k.at + k.rows / 2) * CW, y: C + 80, "text-anchor": "middle", class: "dim" }, k.name.toLowerCase());
});
const takes = add(fig, "g", {});
add(fig, "text", { x: CX - 10, y: C + 111, "text-anchor": "end" }, "Its output =");

// 4. All four heads together, mixed back to 128 and added onto the grid.
const D = C + 240;
label(26, D - 16, "Outputs side by side");
// The size of all four together, bracketed under them.
add(fig, "path", { d: `M27,${D + N + 18} v4 H153 v-4 M90,${D + N + 22} v3`, fill: "none", stroke: "#9ca3af", "stroke-width": 1 });
add(fig, "text", { x: 90, y: D + N + 36, "text-anchor": "middle", class: "dim" }, "155 × 128");
for (let h = 0; h < 4; h++) {
  add(fig, "rect", { x: 26 + 32 * h, y: D, width: 31, height: N, rx: 1.5, fill: h === HEAD - 1 ? OC : tint(OC, 55) });
  add(fig, "text", { x: 26 + 32 * h + 15.5, y: D + N + 13, "text-anchor": "middle", class: "dim", style: h === HEAD - 1 ? "fill:#111;font-weight:700" : "" }, `h${h + 1}`);
}
KINDS.forEach(k => add(fig, "rect", { x: 21, y: D + k.at, width: 3, height: k.rows, fill: k.color }));
line(`M160,${D + 77} H202`);
pill(202, D + 77, "128 × 128");
op(300, D + 82, "+");
label(326, D - 16, "The grid it started from");
grid(326, D);
op(470, D + 82, "=");
label(496, D - 16, "New grid", "155 × 128");
grid(496, D);
add(fig, "text", { x: 640, y: D + 64, class: "dim" }, "each row keeps what it had,");
add(fig, "text", { x: 640, y: D + 78, class: "dim" }, "plus what it took from the rows");
add(fig, "text", { x: 640, y: D + 92, class: "dim" }, "it listened to, then goes on to");
add(fig, "text", { x: 640, y: D + 106, class: "dim" }, "the feed forward step");

const marks = [];
function select(i) {
  title.textContent = `One row: ${rowName(i)}`;
  strips.forEach(([, scale], s) => stripCells[s].forEach((cell, j) => cell.setAttribute("fill", `rgb(${scale(i, j).map(Math.round)})`)));
  // Its output written out: its five biggest percentages, each times that row's value, plus the rest.
  takes.innerHTML = "";
  const top = [...Array(N).keys()].sort((a, b) => WEIGHT[i * N + b] - WEIGHT[i * N + a]).slice(0, 5);
  let x = CX, shown = 0;
  top.forEach(j => {
    const p = Math.round(100 * (WEIGHT[i * N + j] / 255) ** 2), text = `${p}% × ${rowName(j)}`, w = 14 + text.length * 6.4;
    shown += p;
    add(takes, "rect", { x, y: C + 98, width: w, height: 18, rx: 4, fill: "#fff", stroke: kindOf(j).color, "stroke-width": 1.2 });
    add(takes, "text", { x: x + 7, y: C + 111 }, text);
    x += w + 6;
    add(takes, "text", { x: x - 1, y: C + 112, class: "dim" }, "+");
    x += 10;
  });
  add(takes, "text", { x, y: C + 111, class: "dim" }, `${Math.max(0, 100 - shown)}% × the other ${N - 5} rows`);
  marks.forEach(m => m.remove());
  marks.length = 0;
  [[20, 128, A], [QX, 128, A], [KX, 128, A], [VX, 128, A], [QX1, 32, G], [SX, N, G], [BX, N, G], [WX, N, G], [OX, 32, G], [26, 128, D], [326, 128, D], [496, 128, D]].forEach(([x, w, y]) =>
    marks.push(add(fig, "rect", { x: x - 1.5, y: y + i - 1, width: w + 3, height: 3, fill: "none", stroke: "#111", "stroke-width": 1.2, "pointer-events": "none" })));
}
// Point at any row of the grids or the big squares to follow it.
const pointer = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(fig.getScreenCTM().inverse());
const clamp = i => Math.max(0, Math.min(N - 1, Math.floor(i)));
[[20, 128, A], [QX, 128, A], [KX, 128, A], [VX, 128, A], [QX1, 32, G], [SX, N, G], [BX, N, G], [WX, N, G], [OX, 32, G], [26, 128, D], [326, 128, D], [496, 128, D]].forEach(([x, w, y]) => {
  const hit = add(fig, "rect", { x, y, width: w, height: N, fill: "transparent", class: "pick" });
  hit.addEventListener("mousemove", e => select(clamp(pointer(e).y - y)));
});
select(DATA.pick);
// Each figure shows one step; the others are drawn but sit outside its view.
// Each view is shifted so its drawing sits in the middle of the page.
const VIEW = { split: [-113, 0, A + N + 42], head: [0, B - 4, C + 128], combine: [-61, D - 32, D + N + 42] }[PART];
fig.setAttribute("viewBox", `${VIEW[0]} ${VIEW[1]} 980 ${VIEW[2] - VIEW[1]}`);

if (window.frameElement) {
  new ResizeObserver(() => { window.frameElement.style.height = document.body.offsetHeight + "px"; }).observe(document.body);
}
</script>
</body>
</html>
